name: boxing_api
description: >-
  Local REST API of the boxing training planning system (spec/openapi.yaml).
  Runs only on 127.0.0.1 for development, tests and contract validation (ADD-002 D-28).
version: 0.1.0
publish_to: none

# CON-003: exact SDK and package versions are pinned; pubspec.lock is committed.
environment:
  sdk: 3.14.0

dependencies:
  drift: 2.35.3
  logging: 1.3.0
  shelf: 1.4.3
  shelf_router: 1.1.5
  sqlite3: 3.8.0

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.2
